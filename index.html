    <title>DẠY VÀ HỌC SỐ PK TRỰC KHANG</title>
    <script>
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return realFetch;
            },
            set: function(val) {
              if (typeof val === 'function') {
                realFetch = val;
              }
            }
          });
        } catch (e) {
          // Ignore error if window.fetch cannot be redefined
        }
      })();
    </script>
